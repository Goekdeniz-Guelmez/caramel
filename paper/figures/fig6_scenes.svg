<svg xmlns="http://www.w3.org/2000/svg" width="1207" height="628" viewBox="0 0 1207 628" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="27.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1e1e1e">Scene timelines (top track: user B, bottom track: JOSIE A); x = time</text>
