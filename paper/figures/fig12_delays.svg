<text x="190.0" y="229.8" font-size="15" text-anchor="start" fill="#1e1e1e">Column t of seq is the input of step t and the target of step t-1. At step t the depformer first writes</text>
<text x="190.0" y="254.8" font-size="15" text-anchor="start" fill="#1e1e1e">c0 of frame t, then c1..c7 of frame t-1: words of a frame are settled before its acoustics.</text>
<text x="190.0" y="279.8" font-size="15" text-anchor="start" fill="#1e1e1e">Generation runs T+1 steps to emit the acoustics of the last frame (generate.py: S = T + 1).</text></svg>