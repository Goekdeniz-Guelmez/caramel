<text x="560.0" y="392.8" font-size="14" text-anchor="middle" fill="#1e1e1e">KV cache: 16 layers x [B, 16 heads, Tmax, 64] preallocated, Tmax &lt;= 3000 frames (240 s); attention reads 0..pos.</text>
<text x="560.0" y="409.9" font-size="14" text-anchor="middle" fill="#1e1e1e">Budget: &lt; 80 ms per step. Stale mic blocks are dropped rather than drifting. mx.async_eval overlaps frame t+1 with t.</text>
<text x="560.0" y="427.0" font-size="14" text-anchor="middle" fill="#1e1e1e">Weight-only 8-bit / 4-bit quantisation for bandwidth-bound decoding.</text></svg>